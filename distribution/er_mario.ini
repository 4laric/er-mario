# ER Mario settings

# Your Super Mario 64 ROM (US version, .z64, .n64 or .v64). Leave empty to use the ROM file
# placed in this folder. Can be a full path.
rom =

# Camera: sm64 (Lakitu, default) or elden (Elden Ring's own). F9 switches in game.
camera = sm64

# Optional FLUDD backpack: on unlocks Hover, Rocket, Turbo and Squirt for standalone play.
# Base tank: 300 water; each AP tank upgrade adds 100 (up to 600).
# Release the nozzle while safely grounded to refill, including while walking.
# Archipelago controls this setting and nozzle unlocks when connected.
fludd = off

# Water damage: percent of a normal enemy's max HP per hit (boss/AP scaling still applies).
# Squirt is a focused stream; Hover jets also damage targets below Mario.
# Water hits repeat at most once every 12 simulation ticks.
damage_squirt = 12
damage_hover = 6

# Optional Odyssey-style cap throw and bounce, or Sonic-inspired movement.
# on unlocks all moves for standalone play; Archipelago controls connected seeds.
# Cap: tap RT/O to throw; tap again to recall. Timed deployment retains movement momentum.
# Uses Mario's native capped/uncapped heads and original SM64 cap.
cappy = off
# Spin Dash: hold Left Stick Click/U while stationary, then release.
# Charge animation speeds up from 1x to 3x; no drift while charging.
sonic_movement = off

# Thrown bosses go limp (ragdoll) and get back up. off: they just land.
boss_ragdoll = on

# Bosses that never go ragdoll when Mario throws them (character ids, e.g. 4750, 3251).
no_ragdoll =

# Developer keys (F3-F6, F8, F10, F11) and detailed logging. Leave at 0.
debug = 0
