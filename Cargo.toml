[package]
name = "er-mario"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_mario"
crate-type = ["cdylib"]

[dependencies]
eldenring = { path = "../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../fromsoftware-rs/crates/shared" }
glam = "0.30"
cpal = "0.15"
ilhook = { version = "2.3.0", features = ["x64"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
num-bigint = "0.4"
aes = "0.8"
base64 = "0.22"
texpresso = "2"
pelite = "0.10"
hudhook = "0.9.3"

[build-dependencies]
cc = "1"

[profile.release]
panic = "unwind"
